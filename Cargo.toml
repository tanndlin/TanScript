[package]
name = "tanscript"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "from"] }

[workspace]
members = ["lsp", "playground"]
exclude = ["fuzz"]

# Small binary for the browser playground: `cargo build -p tanscript-playground --target wasm32-unknown-unknown --profile wasm`
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
