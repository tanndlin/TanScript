default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--", "-D", "clippy::pedantic"]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true

[jobs.fmt]
command = ["cargo", "fmt", "--", "--check"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--", "script.tan"]
need_stdout = true
allow_warnings = true
background = false
watch = ["script.tan"]
apply_gitignore = false

[keybindings]
c = "job:clippy"
t = "job:test"
r = "job:run"
f = "job:fmt"
