default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--", "-D", "clippy::pedantic"]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true
env.RUST_BACKTRACE = "0"

[jobs.fmt]
command = ["cargo", "fmt", "--", "--check"]
need_stdout = true

[jobs.run]
command = ["cargo", "run", "--", "self-compiler/main.tan"]
need_stdout = true
allow_warnings = true
background = false
watch = ["self-compiler", "script.tan"]
ignore = ["*.asm", "*.o", "*.exe", "*.pdb"]
apply_gitignore = false

[jobs.lsp]
command = ["cargo", "build", "-p", "tanscript-lsp"]
need_stdout = false

[keybindings]
l = "job:lsp"
c = "job:clippy"
t = "job:test"
r = "job:run"
f = "job:fmt"
